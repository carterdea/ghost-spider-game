name: CI

on:
  pull_request:
  push:
    branches: [feat/phaser-prototype]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Fallow
        run: bunx fallow
